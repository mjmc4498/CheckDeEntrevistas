{% extends "layout.html" %}
{% block title %}Interview App{% endblock %}
{% block content %}
<div class="container">
    <h1>Evaluación de Entrevista Técnica</h1>
    <form id="interview-form">
        <div class="form-group">
            <label for="candidate-name">Nombre del Candidato:</label>
            <input type="text" id="candidate-name" required>
        </div>
        <div class="form-group">
            <label for="evaluator-name">Nombre del Evaluador:</label>
            <input type="text" id="evaluator-name" required>
        </div>
        <div class="form-group">
            <label for="interview-date">Fecha de Entrevista:</label>
            <input type="date" id="interview-date" required>
        </div>

        <h2>Competencias Técnicas</h2>
        <div id="technical-skills">
            <!-- Skills will be added here dynamically -->
        </div>
        <button type="button" id="add-skill">Agregar Competencia</button>

        <div class="form-group">
            <label for="additional-notes">Notas Adicionales:</label>
            <textarea id="additional-notes"></textarea>
        </div>

        <button type="submit">Guardar Entrevista</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
