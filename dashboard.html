<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores de Entrevistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Check de Entrevistas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Formulario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="backlog.html">Registros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Indicadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="comparison.html">Comparativa</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Card de Total de Entrevistas -->
            <div class="col-md-4 mb-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total de Entrevistas</h5>
                        <p class="card-text fs-1" id="total-interviews">0</p>
                    </div>
                </div>
            </div>
            <!-- Card de Nivel Promedio -->
            <div class="col-md-4 mb-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Puntaje Promedio</h5>
                        <p class="card-text fs-1" id="average-score">0</p>
                    </div>
                </div>
            </div>
            <!-- Card de Tasa de Aprobación -->
            <div class="col-md-4 mb-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Tasa de Aprobación</h5>
                        <p class="card-text fs-1" id="approval-rate">0%</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Gráfico de Distribución de Niveles -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        Distribución de Niveles Sugeridos
                    </div>
                    <div class="card-body">
                        <canvas id="levels-chart"></canvas>
                    </div>
                </div>
            </div>
            <!-- Gráfico de Estado del Proceso -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        Estado del Proceso
                    </div>
                    <div class="card-body">
                        <canvas id="status-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
