<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros de Entrevistas - Glassmorphism UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes"></div>
    <button class="sidebar-toggle">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav class="sidebar">
        <a href="index.html" class="nav-link">Formulario</a>
        <a href="backlog.html" class="nav-link active">Registros</a>
        <a href="dashboard.html" class="nav-link">Indicadores</a>
    </nav>
    <div class="main-content">
        <div class="container">
            <div class="main-card">
                <h1>Registros de Entrevistas</h1>
                <div class="table-controls">
                    <input type="text" id="search-input" placeholder="Buscar en registros...">
                    <button id="export-csv" class="btn">Exportar a CSV</button>
                </div>
                <div class="table-container">
                    <table id="interviews-table">
                        <thead>
                            <tr>
                                <th>Candidato</th>
                                <th>Evaluador</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Rol</th>
                                <th>Puntaje Total</th>
                                <th>Nivel Sugerido</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be loaded here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="sidebar.js"></script>
    <script src="backlog.js"></script>
</body>
</html>
