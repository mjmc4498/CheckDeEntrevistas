<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Entrevista Técnica - Neumorphism UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Evaluación de Entrevista Técnica</h1>
        <form class="neumorphism-form">
            <div class="form-group">
                <label for="candidate-name">Nombre del Candidato</label>
                <input type="text" id="candidate-name" placeholder="Ingrese el nombre...">
            </div>
            <div class="form-group">
                <label for="evaluator-name">Nombre del Evaluador</label>
                <input type="text" id="evaluator-name" placeholder="Ingrese su nombre...">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="interview-date">Fecha de Entrevista</label>
                    <input type="date" id="interview-date">
                </div>
                <div class="form-group">
                    <label for="interview-time">Hora de Entrevista</label>
                    <input type="time" id="interview-time">
                </div>
            </div>
            <div class="form-group">
                <label for="candidate-role">Rol del Candidato</label>
                <input type="text" id="candidate-role" placeholder="Ej. Data Engineer, Data Analyst...">
            </div>

            <h2>Competencias Técnicas</h2>
            <div class="skills-section">
                <!-- Las competencias se agregarán aquí dinámicamente -->
            </div>
            <button type="button" class="btn btn-add-skill">Agregar Competencia</button>

            <div class="form-group">
                <label for="additional-notes">Notas Adicionales</label>
                <textarea id="additional-notes" rows="4" placeholder="Comentarios..."></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Guardar Entrevista</button>
        </form>
    </div>
</body>
</html>
